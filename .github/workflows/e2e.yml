---
name: "end to end tests"
on:
  push:
  pull_request:
    branches:
      - main
env:
  CIUXCONFIG: /tmp/ciux.sh
  CIUX_VERSION: v0.0.7-rc5
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.21.4'
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build finkctl
        run: |
          go build ./...
      - name: Run unit tests
        run: |
          go test ./...
  push:
    name: Push finkctl image to IN2P3 registry
    runs-on: ubuntu-latest
    needs: test
    # Forks and pull requests have no access to the registry credentials
    if: ${{ github.event_name == 'push' }}
    outputs:
      image-url: ${{ steps.build.outputs.image-url }}
      new-build: ${{ steps.build.outputs.new-build }}
    steps:
      # fetch-depth 0 and the explicit fetch: the image tag is derived from
      # `git describe`, so a missing tag silently yields the wrong image name
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch tags
        run: git fetch --tags --force
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.21.4'
      - name: Install ciux
        run: |
          go install github.com/k8s-school/ciux@"${{ env.CIUX_VERSION }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # push-image.sh falls back to `skopeo copy` when the image already
      # exists in the registry, ie when re-running a build. The latest tag
      # below needs it too.
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      # Before any ciux command: both the ignition below and build.sh probe
      # the registry to decide whether the image must be rebuilt
      - name: Login to IN2P3 registry
        uses: docker/login-action@v3
        with:
          registry: gitlab-registry.in2p3.fr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # Writes .ciux.d/ciux_ci.sh, read back by push-image.sh for the
      # promoted image url
      - name: Ciux project ignition
        run: |
          ciux ignite --selector ci $PWD
      # build.sh runs the same check in its own shell, so the values have to
      # be read back here. Before the push, while the registry still answers
      # what it did at build time.
      - name: Build finkctl image
        id: build
        run: |
          ./build.sh
          $(ciux get image --check $PWD --env)
          echo "image-url=$CIUX_IMAGE_URL" >> "$GITHUB_OUTPUT"
          echo "new-build=$CIUX_BUILD" >> "$GITHUB_OUTPUT"
      - name: Push image to official registry
        run: |
          ./push-image.sh
      - name: Report the built image
        if: steps.build.outputs.new-build == 'true'
        run: |
          {
            echo "## 🐳 Built image"
            echo "**Image URL:** \`${{ steps.build.outputs.image-url }}\`"
            echo
            echo '```bash'
            echo "docker pull ${{ steps.build.outputs.image-url }}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
      - name: Report the reused image
        if: steps.build.outputs.new-build == 'false'
        run: |
          {
            echo "## ♻️ Existing image"
            echo "**Image URL:** \`${{ steps.build.outputs.image-url }}\`"
            echo
            echo "*No new build was needed - the registry already holds this source code*"
          } >> $GITHUB_STEP_SUMMARY
      # main is what a consumer pulls when it does not pin a version
      - name: Apply latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_URL="${{ steps.build.outputs.image-url }}"
          LATEST_TAG=$(echo "$IMAGE_URL" | sed 's/:[^:]*$/:latest/')
          echo "Copying $IMAGE_URL -> $LATEST_TAG"
          skopeo copy docker://"$IMAGE_URL" docker://"$LATEST_TAG"
          {
            echo "## 🏷️ Latest tag applied"
            echo "**Latest tag:** \`$LATEST_TAG\`"
          } >> $GITHUB_STEP_SUMMARY

  scan:
    name: Scan finkctl image
    runs-on: ubuntu-latest
    needs: push
    if: needs.push.outputs.new-build == 'true'
    permissions:
      security-events: write
    steps:
      - name: Login to IN2P3 registry
        uses: docker/login-action@v3
        with:
          registry: gitlab-registry.in2p3.fr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Security scan
        run: |
          IMAGE_URL="${{ needs.push.outputs.image-url }}"
          echo "Pulling and scanning image: $IMAGE_URL"
          docker pull "$IMAGE_URL"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $PWD:/tmp/output \
            -v /tmp/trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.69.3 image \
            --format sarif --output /tmp/output/trivy-results-finkctl.sarif \
            --cache-dir /root/.cache/trivy \
            --timeout 15m \
            "$IMAGE_URL"
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results-finkctl.sarif
